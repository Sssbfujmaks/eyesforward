<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>앞만봐 태블릿</title>
<style>
:root {
  --ink: #2B2140; --sub: #5B5470; --warm: #6A5A50;
  --sun: #FFD84D; --off: #EEE8F5; --offink: #C8BFD8;
  --ok: #3DDC97; --belt: #3F7CF0; --stop: #E5484D;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #000; overflow: hidden; }
body { font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: var(--ink); -webkit-user-select: none; user-select: none; }

#player-wrap { position: fixed; inset: 0; }
#player { width: 100%; height: 100%; }

/* 위·아래 정보 띠 (재생 중에도 보임) */
.bar { position: fixed; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; color: #fff; font-size: 18px; font-weight: 700; pointer-events: none; z-index: 5; }
.bar.top { top: 0; background: linear-gradient(rgba(0,0,0,.55), transparent); }
.bar.bottom { bottom: 0; background: linear-gradient(transparent, rgba(0,0,0,.55)); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #888; margin-right: 8px; vertical-align: middle; }
.dot.on { background: var(--ok); }
.mini-stickers { display: flex; gap: 6px; align-items: center; }
.mini-stickers i { width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,.25); display: grid; place-items: center; font-style: normal; font-size: 13px; color: rgba(255,255,255,.5); }
.mini-stickers i.on { background: var(--sun); color: #7A5A00; }

/* 덮개 화면 (대기·잠금·일시정지·종료) */
#cover { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, #FFE7A8 0%, #FFD0B5 55%, #FFC2D1 100%); transition: opacity .35s; padding: 4vh 4vw; }
#cover.hidden { opacity: 0; pointer-events: none; }
#cover .top { position: absolute; top: 3.2vh; left: 3vw; right: 3vw; display: flex; justify-content: space-between; font-size: clamp(14px, 1.8vw, 24px); color: var(--warm); font-weight: 700; }
.panel { width: min(1120px, 86vw); background: rgba(255,255,255,.92); border-radius: clamp(28px, 4vw, 56px); padding: clamp(28px, 5vh, 64px) clamp(28px, 5vw, 72px); display: flex; gap: clamp(24px, 4vw, 64px); align-items: center; box-shadow: 0 30px 80px rgba(120,60,20,.18); }
.ill { width: clamp(140px, 22vw, 320px); height: auto; flex: none; }
.panel h1 { font-size: clamp(34px, 5.4vw, 76px); font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; }
.panel p { font-size: clamp(16px, 2.2vw, 32px); color: var(--sub); margin-top: 1.2vh; line-height: 1.5; }
.stickers { display: flex; gap: 10px; margin-top: 2.6vh; align-items: center; flex-wrap: wrap; }
.stickers b { flex-basis: 100%; font-size: clamp(14px, 1.8vw, 26px); color: var(--warm); font-weight: 800; }
.st { width: clamp(26px, 3.4vw, 50px); height: clamp(26px, 3.4vw, 50px); border-radius: 50%; display: grid; place-items: center; font-size: clamp(16px, 2.2vw, 30px); background: var(--off); color: var(--offink); transition: transform .3s; }
.st.on { background: var(--sun); color: #7A5A00; box-shadow: inset 0 -4px 0 rgba(0,0,0,.1); }
.st.pop { animation: pop .7s ease-out; }
@keyframes pop { 0% { transform: scale(.4); } 60% { transform: scale(1.35); } 100% { transform: scale(1); } }

/* 짧은 안내 (마지막 편, 다음 편 등) */
#toast { position: fixed; left: 50%; top: 9vh; transform: translateX(-50%) translateY(-20px); background: rgba(255,255,255,.96); color: var(--ink); font-size: clamp(18px, 2.6vw, 34px); font-weight: 800; padding: 18px 34px; border-radius: 999px; box-shadow: 0 16px 40px rgba(0,0,0,.25); opacity: 0; transition: all .35s; z-index: 20; white-space: nowrap; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 스티커 +1 축하 */
#cheer { position: fixed; inset: 0; display: grid; place-items: center; z-index: 30; pointer-events: none; opacity: 0; }
#cheer.show { animation: cheer 1.8s ease-out; }
#cheer div { background: var(--sun); color: #5A4100; font-size: clamp(28px, 4.6vw, 64px); font-weight: 900; padding: 24px 48px; border-radius: 999px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
@keyframes cheer { 0% { opacity: 0; transform: scale(.6); } 15% { opacity: 1; transform: scale(1.05); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }

#tap { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.6); color: #fff; display: none; place-items: center; font-size: 28px; font-weight: 800; }
</style>
</head>
<body>
<div id="player-wrap"><div id="player"></div></div>

<div class="bar top"><span id="seat-label">첫째 · 2열 왼쪽</span><span id="now"></span></div>
<div class="bar bottom"><span><span class="dot" id="dot"></span><span id="conn">연결 중</span></span><span class="mini-stickers" id="mini"></span></div>

<div id="cover">
  <div class="top"><span id="cover-seat">첫째 · 2열 왼쪽</span><span id="cover-info"></span></div>
  <div class="panel">
    <svg class="ill" viewBox="0 0 200 200" id="ill">
      <circle cx="100" cy="100" r="96" fill="#FFF3D6"/>
      <rect x="62" y="40" width="76" height="120" rx="30" fill="#FF8A65"/>
      <circle cx="100" cy="62" r="26" fill="#FFD3B0"/>
      <circle cx="91" cy="60" r="3.5" fill="#2B2140"/><circle cx="109" cy="60" r="3.5" fill="#2B2140"/>
      <path d="M92 71 q8 6 16 0" stroke="#2B2140" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M58 52 L142 150" stroke="#3F7CF0" stroke-width="16" stroke-linecap="round"/>
      <rect x="112" y="122" width="34" height="22" rx="6" fill="#2B2140" transform="rotate(40 129 133)"/>
      <g id="check"><circle cx="160" cy="44" r="18" fill="#3DDC97"/><path d="M151 44 l6 6 l11 -12" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
    </svg>
    <div>
      <h1 id="cover-title">벨트를 매면<br>영상이 나와요!</h1>
      <p id="cover-text">찰칵 소리가 나면 바로 시작해요.</p>
      <div class="stickers" id="stickers"><b>벨트 스티커</b></div>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="cheer"><div>스스로 맸어요! 스티커 +1</div></div>
<div id="tap">화면을 한 번 눌러 주세요 (소리 재생 허용)</div>

<script>
// ---- 설정 ----
const q = new URLSearchParams(location.search);
const SEAT = q.get("seat") === "right" ? "right" : "left";
const SEAT_LABEL = { left: "첫째 · 2열 왼쪽", right: "둘째 · 2열 오른쪽" }[SEAT];
// 부모가 골라 둔 재생목록 (YouTube 영상 ID)
const PLAYLIST = {
  left:  ["yCjJyiqpAuU", "e_04ZrNroTo", "3xqqj9o7TgA"],
  right: ["XqZsoesa55w", "020g-0hhCAU", "e_04ZrNroTo"],
}[SEAT];
const GOAL = 10;
const WS_URL = q.get("ws") || `ws://${location.host || "192.168.219.112:8765"}`;

const $ = id => document.getElementById(id);
$("seat-label").textContent = SEAT_LABEL;
$("cover-seat").textContent = SEAT_LABEL;

// ---- 상태 ----
let state = "wait";       // wait | play | lock | pause | end
let idx = 0, volume = 70;
let stickers = 0;
try { if (q.get("reset") !== "1") stickers = Number(localStorage.getItem("stickers_" + SEAT) || 0); } catch {}
let player = null, ready = false, wantPlay = false;

// ---- 스티커 ----
function renderStickers(popIndex = -1) {
  const big = $("stickers"); big.querySelectorAll(".st").forEach(e => e.remove());
  const mini = $("mini"); mini.innerHTML = "";
  for (let i = 0; i < GOAL; i++) {
    const s = document.createElement("span"); s.className = "st" + (i < stickers ? " on" : "") + (i === popIndex ? " pop" : ""); s.textContent = "★"; big.appendChild(s);
    const m = document.createElement("i"); m.className = i < stickers ? "on" : ""; m.textContent = "★"; mini.appendChild(m);
  }
  const t = document.createElement("span"); t.style.cssText = "margin-left:6px"; t.textContent = `${stickers}/${GOAL}`; mini.appendChild(t);
}
function addSticker() {
  stickers = Math.min(GOAL, stickers + 1);
  try { localStorage.setItem("stickers_" + SEAT, stickers); } catch {}
  renderStickers(stickers - 1);
  const c = $("cheer"); c.classList.remove("show"); void c.offsetWidth; c.classList.add("show");
}

// ---- 덮개 화면 ----
const COVERS = {
  wait:  ["벨트를 매면<br>영상이 나와요!", "찰칵 소리가 나면 바로 시작해요.", false],
  lock:  ["벨트 매면<br>다시 나와요!", "찰칵 소리가 나면 영상이 이어서 재생돼요.", false],
  pause: ["잠깐<br>멈췄어요", "", true],
  end:   ["오늘 영상은<br>여기까지!", "도착했어요. 벨트 풀고 내릴 준비해요.", true],
};
function showCover(kind, text) {
  const [title, sub, check] = COVERS[kind];
  $("cover-title").innerHTML = title;
  $("cover-text").textContent = text || sub;
  $("check").style.display = check ? "" : "none";
  const t = currentTitle();
  $("cover-info").textContent = t ? `⏸ ${t}` : "";
  $("cover").classList.remove("hidden");
}
function hideCover() { $("cover").classList.add("hidden"); }

function toast(text, ms = 3200) {
  const t = $("toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), ms);
}

// ---- YouTube IFrame Player API ----
function currentTitle() { try { return player && player.getVideoData ? player.getVideoData().title : ""; } catch { return ""; } }
window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player("player", {
    videoId: PLAYLIST[idx],
    playerVars: { playsinline: 1, rel: 0, controls: 1, fs: 0, iv_load_policy: 3, origin: location.origin },
    events: {
      onReady: () => { ready = true; player.setVolume(volume); if (wantPlay) doPlay(); report(); },
      onStateChange: e => {
        if (e.data === YT.PlayerState.ENDED) next(true);
        // 잠금·대기 중에 아이가 재생을 눌러도 다시 멈춘다
        if (e.data === YT.PlayerState.PLAYING && state !== "play") player.pauseVideo();
        $("now").textContent = currentTitle() ? "▶ " + currentTitle() : "";
        report();
      },
      onError: () => next(true),
    },
  });
};
(function loadYT() { const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s); })();

function doPlay() {
  wantPlay = true;
  if (!ready) return;
  player.playVideo();
  // 브라우저가 소리 있는 자동재생을 막으면 한 번 눌러 달라고 안내 (안드로이드 앱에서는 뜨지 않음)
  setTimeout(() => { if (state === "play" && player.getPlayerState() !== YT.PlayerState.PLAYING && player.getPlayerState() !== YT.PlayerState.BUFFERING) $("tap").style.display = "grid"; }, 1500);
}
function doPause() { wantPlay = false; if (ready) player.pauseVideo(); }
function next(auto) {
  idx = (idx + 1) % PLAYLIST.length;
  if (!ready) return;
  if (state === "play") player.loadVideoById(PLAYLIST[idx]); else player.cueVideoById(PLAYLIST[idx]);
  if (!auto) toast("다음 편을 틀었어요");
}
$("tap").onclick = () => { $("tap").style.display = "none"; if (state === "play") player.playVideo(); };

// ---- 차량 명령 처리 ----
function handle(cmd) {
  switch (cmd.action) {
    case "play":
      state = "play"; hideCover(); doPlay();
      if (cmd.sticker) addSticker();
      if (cmd.text) toast(cmd.text);
      break;
    case "lock":   // 벨트 해제: 먼저 멈추고 덮는다
      state = "lock"; doPause(); showCover("lock", cmd.text); break;
    case "pause":  // 문 열림, 부모 음성 "멈춰"
      state = "pause"; doPause(); showCover("pause", cmd.text); break;
    case "wait":
      state = "wait"; doPause(); showCover("wait", cmd.text); break;
    case "end":
      state = "end"; doPause(); showCover("end", cmd.text); break;
    case "next":
      next(false); break;
    case "volume":
      volume = Math.max(0, Math.min(100, volume + (cmd.delta || 0)));
      if (ready) player.setVolume(volume);
      toast(cmd.delta < 0 ? `소리를 줄였어요 (${volume})` : `소리를 키웠어요 (${volume})`); break;
    case "say":
      toast(cmd.text, cmd.ms || 4000); break;
    case "reset_stickers":
      stickers = 0; try { localStorage.setItem("stickers_" + SEAT, 0); } catch {} renderStickers(); break;
  }
  report();
}

// ---- 배터리 (안드로이드 앱이면 네이티브 값, 아니면 브라우저 값) ----
let battery = null, charging = false;
async function readBattery() {
  try {
    if (window.Tablet && Tablet.battery) { const b = JSON.parse(Tablet.battery()); battery = b.level; charging = b.charging; return; }
    if (navigator.getBattery) { const b = await navigator.getBattery(); battery = Math.round(b.level * 100); charging = b.charging; }
  } catch {}
}

// ---- WebSocket ----
let ws = null;
function report() {
  if (!ws || ws.readyState !== 1) return;
  const playing = ready && player.getPlayerState && player.getPlayerState() === 1;
  ws.send(JSON.stringify({ type: "status", seat: SEAT, state, playing, title: currentTitle(), battery, charging, stickers }));
}
function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    $("dot").classList.add("on"); $("conn").textContent = "차량 연결됨";
    ws.send(JSON.stringify({ type: "hello", role: "tablet", seat: SEAT }));
    readBattery().then(report);
  };
  ws.onmessage = e => { try { const m = JSON.parse(e.data); if (m.type === "cmd") handle(m); } catch {} };
  ws.onclose = () => { $("dot").classList.remove("on"); $("conn").textContent = "차량 연결 대기"; setTimeout(connect, 2000); };
  ws.onerror = () => ws.close();
}
setInterval(() => readBattery().then(report), 5000);

renderStickers();
showCover("wait");
connect();
</script>
</body>
</html>
